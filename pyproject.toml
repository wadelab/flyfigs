[project]
name = "flyfigs"
version = "0.1.0"
description = "Contrast-response, effect-size and climbing analyses for Drosophila SSVEP and climbing data, configured per dataset by a TOML file"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alex Wade" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[project.scripts]
flyfigs = "flyfigs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flyfigs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
